name: CI

on:
  push:
    branches: [developer, main]
  pull_request:

# Read-only: this workflow tests and builds; it never pushes images or deploys.
permissions:
  contents: read

# A newer pull-request run makes an older one obsolete. Pushes are left alone so
# a run that will later gate a deployment is never cancelled mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      # The suite mocks every provider call and redirects the evaluation log to a
      # temporary path, so no .env file, API key, or network access is required.
      - name: Run pytest
        run: python -m pytest -q

  test-frontend:
    name: Frontend tests and build (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test

      # The same production build the Dockerfile runs. A relative API base URL
      # keeps the bundle same-origin behind Nginx, with no domain baked in.
      - name: Build the production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: /

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    # Pull requests only test; pushes to developer/main also prove both images
    # build. Image publishing and the VPS deploy are intentionally not here yet.
    if: github.event_name == 'push'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the backend image
        run: docker build --tag virastar-backend:ci backend

      - name: Build the frontend image
        run: docker build --tag virastar-frontend:ci --build-arg VITE_API_BASE_URL=/ frontend
