# Nginx server configuration for the production frontend image.
#
# Serves the Vite build as a single-page app and proxies API traffic to the
# backend service on the Docker network, so the browser only talks to one
# origin and no CORS configuration is needed.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression -------------------------------------------------------- #
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Security headers --------------------------------------------------- #
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # --- Backend proxy ------------------------------------------------------ #
    # Shared proxy settings for the /api/ and /health locations below. The read
    # timeout is deliberately above the backend's worst case (a 30s Groq
    # attempt followed by a 30s Gemini fallback), so the proxy does not cut a
    # correction off before the fallback can answer.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    # No trailing slash on proxy_pass: the original URI (/api/v1/correct) is
    # forwarded unchanged to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # --- SPA ---------------------------------------------------------------- #
    # Client-side routes fall back to index.html. Hashed asset files are served
    # directly; a missing asset stays a 404 instead of returning HTML.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
